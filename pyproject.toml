[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cost-aware-lob-forecasting"
version = "1.0.0"
description = "Cost-aware limit order book forecasting with XGBoost, DeepLOB, and Transformers"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = {text = "MIT"}
keywords = ["limit-order-book", "deep-learning", "quantitative-finance", "pytorch", "xgboost"]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "torch>=2.2",
  "PyYAML>=6.0",
  "joblib>=1.3",
  "xgboost>=2.0",
]

[project.optional-dependencies]
notebooks = [
  "jupyterlab>=4.0",
  "matplotlib>=3.8",
  "nbformat>=5.9",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
